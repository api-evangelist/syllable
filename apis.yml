apis:
- aid: syllable:syllable-platform-sdk
  name: Syllable Platform SDK API
  description: The Syllable Platform SDK REST API for building and operating AI agents across voice, SMS,
    email and chat channels. 176 operations across 107 paths cover agent configuration, prompt versioning,
    tools and step workflows, services and credential stores, data sources, channels and targets (including
    Twilio numbers and SIP), conversations and sessions with transcripts and latency timelines, outbound
    campaigns and batches, insights folders/workflows/tools, directory, dashboards, incidents, takeouts,
    organizations, roles, permissions and users. Authentication is an organization API token sent in the
    Syllable-API-Key header.
  humanURL: https://docs.syllable.ai/
  baseURL: https://api.syllable.cloud
