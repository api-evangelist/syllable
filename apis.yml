aid: syllable
name: Syllable
description: Syllable is a Mountain View, California company (founded 2017) that operates an agentic platform
  for building, deploying and optimizing AI voice, SMS, email, web-chat and WhatsApp agents, with a strong
  focus on healthcare patient experience and contact-center automation. The Syllable Platform SDK exposes
  a REST API at api.syllable.cloud covering agents, prompts, tools, services, data sources, channels and
  channel targets, sessions and transcripts, outbound campaigns and batches, insights workflows, directory,
  dashboards, incidents, organizations, roles, permissions and users. First-party TypeScript and Python
  SDKs, a Go CLI, a documentation MCP server and a published A2A agent card make it an unusually agent-forward
  developer surface.
