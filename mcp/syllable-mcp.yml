scope_note: This is a documentation MCP server, not a platform-API MCP server. Its three tools search
  and read the Syllable SDK documentation corpus and file docs feedback; none of them call the api.syllable.cloud
  platform API. An agent that needs to operate Syllable resources uses the REST API, the TypeScript/Python
  SDKs, or the first-party Go CLI (which ships its own Claude Code skill) — see mcp/syllable-tool-crosswalk.yml.
  Probes for a platform MCP server at api.syllable.cloud/mcp (404), syllable.ai/mcp (405) and mcp.syllable.ai
  (DNS does not resolve) all missed.
