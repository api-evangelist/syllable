    JsonValue: {}
    AgentResponse:
      properties:
        name:
          type: string
          title: Name
          description: The agent name
          examples:
          - Weather agent
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The agent description
          examples:
          - Agent for answering questions about weather.
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: The agent label (DEPRECATED - use labels instead.)
          deprecated: true
          examples:
          - Information
        labels:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Labels
          description: The agent labels
          examples:
          - - Information
            - Weather
        type:
          type: string
          title: Type
          description: The agent type. Must be "ca_v1" currently.
          examples:
          - ca_v1
        prompt_id:
          type: integer
          title: Prompt Id
          description: ID of the prompt associated with the agent
          examples:
          - 1
        prompt_version_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Prompt Version Number
          description: Optional pin to a specific version of the prompt (prompt history version number). When omitted or null, the agent tracks the latest/current version of the prompt. When set, the agent runs that specific prompt version. Must reference an existing version of the agent's prompt.
          examples:
          - 3
        custom_message_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Custom Message Id
          description: Internal ID of the custom message that should be delivered at the beginning of a conversation with the agent
          examples:
          - 1
        language_group_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Language Group Id
          description: Internal ID of the language group associated with the agent
          examples:
          - 1
        bridge_phrases_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bridge Phrases Id
          description: Internal ID of the bridge phrases config associated with the agent
          examples:
          - 1
        timezone:
          type: string
          title: Timezone
          description: The time zone in which the agent operates
          examples:
          - America/New_York
          - America/Chicago
        prompt_tool_defaults:
          items:
            $ref: '#/components/schemas/AgentToolDefaults'
          type: array
          title: Prompt Tool Defaults
          description: Agent-level static parameter values for the agent's tools, overriding any tool-level defaults
          examples:
          - - default_values:
              - default_value: fahrenheit
                field_name: temperature_unit
              tool_name: get_weather
        languages:
          items:
            type: string
          type: array
          title: Languages
          description: BCP 47 codes of languages the agent supports. (DEPRECATED - pass an empty list here and use language group ID to link agent to a language group instead.)
          deprecated: true
          examples:
          - - en-US
            - es-US
        variables:
          additionalProperties:
            type: string
          type: object
          title: Variables
          description: Custom context variables for the conversation session. Keys should be prefixed with "vars.".
          examples:
          - vars.location_name: Main Street Pizza
        tool_headers:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Tool Headers
          description: Optional headers to include in tool calls for agent. (It is discouraged to use this field for "Authorization" headers, as values here are not encrypted. Instead, set up a service with either basic, bearer, or custom header auth; attach the appropriate tools to that service, and the attached tools will automatically use the auth configured on the service.)
          examples:
          - some-header: some-value
        agent_initiated:
          type: boolean
          title: Agent Initiated
          description: Whether the agent initiates conversation with a user after the custom_message is delivered
          default: false
          examples:
          - false
        stt_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Stt Provider
          description: Speech-to-text provider for the agent.
          examples:
          - Google STT V2 (Chirp 2)
          - Deepgram Nova 3 (On-Prem)
          - Deepgram Nova 3
          - Google STT V2
          - Google STT V1
          - Deepgram Nova 2
        wait_sound:
          anyOf:
          - type: string
          - type: 'null'
          title: Wait Sound
          description: Sound to play while waiting for a response from the LLM.
          examples:
          - No Sound
          - Keyboard 1
          - Keyboard 2
          - Call Center
        enable_verbal_language_change:
          type: boolean
          title: Enable Verbal Language Change
          description: Enables Dynamic Language Switching - when true and a voice group is configured, callers may switch among group languages by speaking at any point in the conversation (in addition to DTMF in response to the language menu).
          default: false
          examples:
          - false
        id:
          type: integer
          title: Id
          description: Internal ID of the agent
          examples:
          - 1
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp of most recent update
          examples:
          - '2024-01-01T00:00:00Z'
        last_updated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Updated By
          description: Email of the user who last updated the agent
          examples:
          - user@email.com
        prompt:
          anyOf:
          - $ref: '#/components/schemas/PromptResponse'
          - type: 'null'
          description: The prompt associated with the agent.
          examples: []
        custom_message:
          anyOf:
          - $ref: '#/components/schemas/CustomMessageResponse'
          - type: 'null'
          description: The message associated with the agent. Will be delivered as a greeting at the beginning of a conversation.
          examples: []
        channel_targets:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChannelTargetResponse'
            type: array
          - type: 'null'
          title: Channel Targets
          description: Channel targets associated with the agent
          examples: []
        tools:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolResponse'
            type: array
          - type: 'null'
          title: Tools
          description: Tools associated with the agent
          examples: []
        language_group:
          anyOf:
          - $ref: '#/components/schemas/LanguageGroupResponse'
          - type: 'null'
          description: The language group associated with the agent
          examples: []
      type: object
      required:
      - name
      - type
      - prompt_id
      - timezone
      - variables
      - tool_headers
      - id
      - updated_at
      - last_updated_by
