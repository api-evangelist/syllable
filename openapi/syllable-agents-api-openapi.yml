    CaseExpression:
      properties:
        case:
          items:
            $ref: '#/components/schemas/ConditionalValue'
          type: array
          title: Case
          description: Ordered conditional branches (reserved for future runtime support).
      type: object
      required:
      - case
      title: CaseExpression
      description: 'Conditional branch expression.


        Note: CaseExpression is currently reserved and not yet executed at runtime.'
    SaveAction:
      properties:
        if:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CelExpression'
            - $ref: '#/components/schemas/JMESPathExpression'
            discriminator:
              propertyName: type
              mapping:
                cel: '#/components/schemas/CelExpression'
                jmespath: '#/components/schemas/JMESPathExpression'
                jp: '#/components/schemas/JMESPathExpression'
          - $ref: '#/components/schemas/CaseExpression'
          - type: string
          - type: 'null'
          title: If
          description: 'Condition to decide whether this item executes. Supported expression forms: (1) JMESPath string (default for plain strings), (2) typed JMESPath object {"type":"jp"|"jmespath","expression":"..."}, or (3) typed CEL object {"type":"cel","expression":"..."}. Example JMESPath string: "inputs.can_sign_consent == `true`".'
          examples:
          - inputs.can_sign_consent == `true`
          - expression: inputs.can_sign_consent == `true`
            type: jp
          - expression: inputs.can_sign_consent == true
            type: cel
        action:
          type: string
          const: save
          title: Action
          default: save
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: Target name to save (defaults to global variable).
        inputs:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Inputs
          description: Input field names to persist; None saves all collected inputs.
      type: object
      title: SaveAction
    ValidationIssue:
      properties:
        id:
          type: string
          title: Id
          description: Stable machine-readable identifier (kebab-case)
        severity:
          type: string
          enum:
          - info
          - warning
          - error
          title: Severity
          default: error
        message:
          type: string
          title: Message
          description: Human-readable description
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
          description: JSONPath-style location (e.g. $.context.task.steps[2])
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: The offending value, when it adds clarity
      type: object
      required:
      - id
      - message
      title: ValidationIssue
      description: A single validation finding with severity, location, and description.
    ListResponse_AgentResponse_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentResponse'
          type: array
          title: Items
          description: List of items returned from the query
          examples: []
        page:
          type: integer
          title: Page
          description: The page number of the results (0-based)
          examples:
          - 0
        page_size:
          type: integer
          title: Page Size
          description: The number of items returned per page
          examples:
          - 25
        total_pages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Pages
          description: The total number of pages of results given the indicated page size
          examples:
          - 4
        total_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Count
          description: The total number of items returned from the query
          examples:
          - 100
      type: object
      required:
      - items
      - page
      - page_size
      title: ListResponse[AgentResponse]
    ValidationError:
      properties:
