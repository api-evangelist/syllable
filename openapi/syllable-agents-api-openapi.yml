            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AgentVoiceGender:
      type: string
      enum:
      - female
      - male
      title: AgentVoiceGender
      description: Gender for an agent voice.
    ToolResponse:
      properties:
        name:
          type: string
          title: Name
          description: The name of the tool
          examples:
          - Weather Fetcher
        definition:
          $ref: '#/components/schemas/ToolDefinition'
          description: The definition of the tool
          examples:
          - endpoint:
              argument_location: query
              method: get
              url: https://api.open-meteo.com/v1/forecast
            static_parameters:
            - default: fahrenheit
              description: Whether the temperature information should be fetched in Celsius or Fahrenheit
              name: temperature_unit
              required: false
              type: string
            tool:
              function:
                description: Get the weather for a city
                name: get_weather
                parameters:
                  properties:
                    latitude:
                      description: Latitude of the city
                      type: number
                    longitude:
                      description: Longitude of the city
                      type: number
                    current:
                      default: temperature_2m,relative_humidity_2m,precipitation,rain,showers
                      description: Information to retrieve from the open-meteo API, comma-separated
                      type: string
                  required:
                  - latitude
                  - longitude
                  - current
                  type: object
              type: function
            type: endpoint
        service_id:
          type: integer
          title: Service Id
          description: Internal ID of the service to which the tool belongs
          examples:
          - 1
        id:
          type: integer
          title: Id
          description: The internal ID of the tool
          examples:
          - 1
        last_updated_comments:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Updated Comments
          description: Comments for the most recent edit to the tool.
          examples:
          - Updated to use new API endpoint
        service_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Name
          description: The name of the service to which the tool belongs
        prompts_info:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolPromptInfo'
            type: array
          - type: 'null'
          title: Prompts Info
          description: IDs and names of the prompts linked to the tool
        agents_info:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolAgentInfo'
            type: array
          - type: 'null'
          title: Agents Info
          description: IDs and names of the agents linked to the tool via a prompt
        last_updated:
          type: string
          format: date-time
          title: Last Updated
          description: The timestamp of the most recent update to the tool
        last_updated_by:
          type: string
          title: Last Updated By
          description: The email of the user who last updated the tool
          examples:
          - user@email.com
        version_number:
          type: integer
          title: Version Number
          description: Highest tools_history snapshot version for this tool; the tools row defaults to 1.
          examples:
          - 1
        validation_issues:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          - type: 'null'
          title: Validation Issues
          description: Validation issues found in the tool definition. Warnings and infos are informational; errors block the save.
      type: object
      required:
      - name
      - definition
      - service_id
      - id
      - last_updated
      - last_updated_by
      - version_number
      title: ToolResponse
      description: 'Response model for tool operations.

        A tool is a function that an agent can call to perform actions like accessing databases,

        making API calls, or processing data. For an agent to have access to a tool, the prompt

        associated with that agent should be linked to the tool and include instructions to use it.

        For more information, see [Console docs](https://docs.syllable.ai/Resources/Tools).'
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: Syllable-API-Key
