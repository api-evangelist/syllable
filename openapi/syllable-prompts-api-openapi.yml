          anyOf:
          - type: string
          - type: 'null'
          title: Title
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
        pattern:
          anyOf:
          - type: string
          - type: 'null'
          title: Pattern
        enum:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Enum
        examples:
          anyOf:
          - items:
              $ref: '#/components/schemas/JsonValue'
            type: array
          - type: 'null'
          title: Examples
      type: object
      required:
      - name
      title: Variable
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ToolHttpEndpoint:
      properties:
        url:
          type: string
          title: Url
          description: The endpoint URL of the external service to call.
          examples:
          - https://api.example.com
        method:
          $ref: '#/components/schemas/ToolHttpMethod'
          description: The HTTP method to use for the service call.
          examples:
          - get
        argument_location:
          $ref: '#/components/schemas/ToolArgumentLocation'
          description: How to pass the arguments to the request.
          examples:
          - query
        timeout:
          anyOf:
          - type: number
            maximum: 120
            minimum: 1
          - type: 'null'
          title: Timeout
          description: Timeout in seconds for the HTTP request. Default 20 seconds when not set.
          examples:
          - 45.0
      type: object
      required:
      - url
      - method
      - argument_location
      title: ToolHttpEndpoint
      description: The configuration for an HTTP API call by a tool.
    InternalTool:
      properties:
        type:
          type: string
          const: function
          title: Type
          description: Always `function`.
          default: function
          examples:
          - function
        function:
          $ref: '#/components/schemas/ToolFunction'
          description: The tool function definition, including the JSON Schema of its parameters.
          examples: []
      type: object
      required:
      - function
      title: InternalTool
      description: A tool definition to be used by the OpenAI API.
    ConditionalValue:
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/JsonValue'
          - type: 'null'
          description: Initial value of the variable.
        valueFrom:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CelExpression'
            - $ref: '#/components/schemas/JMESPathExpression'
            discriminator:
              propertyName: type
              mapping:
                cel: '#/components/schemas/CelExpression'
                jmespath: '#/components/schemas/JMESPathExpression'
                jp: '#/components/schemas/JMESPathExpression'
          - $ref: '#/components/schemas/CaseExpression'
          - type: string
          - type: 'null'
          title: Valuefrom
          description: 'Expression that computes the value. Supported expression forms: (1) JMESPath string (default for plain strings), (2) typed JMESPath object {"type":"jp"|"jmespath","expression":"..."}, or (3) typed CEL object {"type":"cel","expression":"..."}. Mutually exclusive with value.'
          examples:
          - inputs.provided_dob == patient_dob
          - expression: inputs.provided_dob == patient_dob
            type: jmespath
          - expression: inputs.count + 1
            type: cel
        if:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CelExpression'
            - $ref: '#/components/schemas/JMESPathExpression'
            discriminator:
              propertyName: type
              mapping:
                cel: '#/components/schemas/CelExpression'
                jmespath: '#/components/schemas/JMESPathExpression'
                jp: '#/components/schemas/JMESPathExpression'
          - $ref: '#/components/schemas/CaseExpression'
          - type: string
          - type: 'null'
          title: If
          description: 'Condition to decide whether this item executes. Supported expression forms: (1) JMESPath string (default for plain strings), (2) typed JMESPath object {"type":"jp"|"jmespath","expression":"..."}, or (3) typed CEL object {"type":"cel","expression":"..."}. Example JMESPath string: "inputs.can_sign_consent == `true`".'
          examples:
          - inputs.can_sign_consent == `true`
          - expression: inputs.can_sign_consent == `true`
            type: jp
          - expression: inputs.can_sign_consent == true
            type: cel
      type: object
      title: ConditionalValue
    CallResultSaveMapping:
      properties:
        from:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/CelExpression'
            - $ref: '#/components/schemas/JMESPathExpression'
            discriminator:
              propertyName: type
              mapping:
                cel: '#/components/schemas/CelExpression'
                jmespath: '#/components/schemas/JMESPathExpression'
                jp: '#/components/schemas/JMESPathExpression'
          - $ref: '#/components/schemas/CaseExpression'
          - type: string
          title: From
          description: 'Expression evaluated against the parsed tool response body (the JSON the external tool returned). Supported forms: (1) JMESPath string (default for plain strings) — a bare field name for raw passthrough, or a boolean/computed expression for derived values, (2) typed JMESPath object {"type":"jp"|"jmespath","expression":"..."}, or (3) typed CEL object {"type":"cel","expression":"..."}.'
          examples:
          - is_valid
          - readable_phone_number
          - status == 'valid'
        to:
          type: string
          title: To
          description: Workflow variable name to store the extracted value under.
      type: object
      required:
      - from
      - to
      title: CallResultSaveMapping
      description: 'One field-extraction mapping applied to a call action''s tool response.


        Example: {"from": "is_valid", "to": "is_valid"}

        Example (derived value): {"from": "status == ''valid''", "to": "is_valid"}'
    StaticToolParameterType:
      type: string
      enum:
      - string
      - int
      - boolean
      - data_source_list
      title: StaticToolParameterType
      description: The expected type for a static tool parameter.
    ContextToolInfo:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
          description: The name of the generated tool.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: The description of the tool.
      type: object
      title: ContextToolInfo
    LoadToolFromFileTask:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: A unique identifier for the task.
        config:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/JsonValue'
            type: object
          - type: 'null'
          title: Config
        variables:
          anyOf:
          - items:
              $ref: '#/components/schemas/Variable'
            type: array
          - type: 'null'
          title: Variables
        metadata:
          anyOf:
          - $ref: '#/components/schemas/ContextTaskMetadata'
          - type: 'null'
        tool:
          anyOf:
          - $ref: '#/components/schemas/ContextToolInfo'
          - type: 'null'
        type:
          type: string
          const: import
          title: Type
          default: import
        version:
          type: string
          const: v1alpha
          title: Version
          default: v1alpha
        file:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: File
          description: The local path of the tool definition JSON file.
      type: object
      required:
      - file
      title: LoadToolFromFileTask
      description: Bootstraps a tool from a file (for internal developer use only if ENV.local=True).
    ToolFunction:
      properties:
        name:
          type: string
          title: Name
          description: The name of the function/tool call.
          examples:
          - get_weather
        description:
          type: string
          title: Description
          description: The description of the tool.
          examples:
          - Get the weather for a city
        parameters:
          title: Parameters
          description: The JSON Schema of parameters of the function/tool call.
          examples:
          - {}
      type: object
      required:
      - name
      - description
      - parameters
      title: ToolFunction
      description: 'A function available to an agent.


        See:

        - https://learn.microsoft.com/en-us/azure/ai-services/openai/how-to/function-calling'
    ToolResponse:
      properties:
        name:
          type: string
          title: Name
          description: The name of the tool
          examples:
          - Weather Fetcher
        definition:
          $ref: '#/components/schemas/ToolDefinition'
          description: The definition of the tool
          examples:
          - endpoint:
              argument_location: query
              method: get
              url: https://api.open-meteo.com/v1/forecast
            static_parameters:
            - default: fahrenheit
              description: Whether the temperature information should be fetched in Celsius or Fahrenheit
              name: temperature_unit
              required: false
              type: string
            tool:
              function:
                description: Get the weather for a city
                name: get_weather
                parameters:
                  properties:
                    latitude:
                      description: Latitude of the city
                      type: number
                    longitude:
                      description: Longitude of the city
                      type: number
                    current:
                      default: temperature_2m,relative_humidity_2m,precipitation,rain,showers
                      description: Information to retrieve from the open-meteo API, comma-separated
                      type: string
                  required:
                  - latitude
                  - longitude
                  - current
                  type: object
              type: function
            type: endpoint
        service_id:
          type: integer
          title: Service Id
          description: Internal ID of the service to which the tool belongs
          examples:
          - 1
        id:
          type: integer
          title: Id
          description: The internal ID of the tool
          examples:
          - 1
        last_updated_comments:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Updated Comments
          description: Comments for the most recent edit to the tool.
          examples:
          - Updated to use new API endpoint
        service_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Name
          description: The name of the service to which the tool belongs
        prompts_info:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolPromptInfo'
            type: array
          - type: 'null'
          title: Prompts Info
          description: IDs and names of the prompts linked to the tool
        agents_info:
          anyOf:
          - items:
              $ref: '#/components/schemas/ToolAgentInfo'
            type: array
          - type: 'null'
          title: Agents Info
          description: IDs and names of the agents linked to the tool via a prompt
        last_updated:
          type: string
          format: date-time
          title: Last Updated
          description: The timestamp of the most recent update to the tool
        last_updated_by:
          type: string
          title: Last Updated By
          description: The email of the user who last updated the tool
          examples:
          - user@email.com
        version_number:
          type: integer
          title: Version Number
          description: Highest tools_history snapshot version for this tool; the tools row defaults to 1.
          examples:
          - 1
        validation_issues:
          anyOf:
          - items:
              $ref: '#/components/schemas/ValidationIssue'
            type: array
          - type: 'null'
          title: Validation Issues
          description: Validation issues found in the tool definition. Warnings and infos are informational; errors block the save.
      type: object
      required:
      - name
      - definition
      - service_id
      - id
      - last_updated
      - last_updated_by
      - version_number
      title: ToolResponse
      description: 'Response model for tool operations.

        A tool is a function that an agent can call to perform actions like accessing databases,

        making API calls, or processing data. For an agent to have access to a tool, the prompt

        associated with that agent should be linked to the tool and include instructions to use it.

        For more information, see [Console docs](https://docs.syllable.ai/Resources/Tools).'
