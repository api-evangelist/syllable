authentication:
  style: api-key
  header: Syllable-API-Key
  scheme_name: APIKeyHeader
  scope: per-organization
  notes: >-
    One API token per organization, generated and revoked from the Syllable Console
    (profile menu -> API tokens). The token is displayed once at creation. Tokens carry a
    creation and an expiry timestamp and can be revoked from the console. The CLI reads
    the key from the SYLLABLE_API_KEY environment variable or from ~/.syllable/config.yaml,
    which supports multiple orgs and multiple environments per org.
  docs: https://docs.syllable.ai/account/APITokens
  artifact: authentication/syllable-authentication.yml
idempotency:
  supported: false
  evidence: >-
    No Idempotency-Key header, parameter, or extension appears anywhere in the 176-operation
    OpenAPI, and the documentation and CLI describe no retry-safety contract for writes.
    Recorded as absent — no Idempotency pointer is emitted in apis.yml.
pagination:
  style: page-and-limit
  request_params:
  - name: page
    default: 0
    note: zero-based page index
  - name: limit
    default: 25
    note: results per page
  applies_to_operations: 30
  ordering_params:
  - order_by
  - order_by_direction
  filtering_params:
  - search_fields
  - search_field_values
  - start_datetime
  - end_datetime
  sparse_fields_param: fields
  response_envelope: ListResponse_<Entity>_
  note: >-
    List endpoints return a generic ListResponse envelope parameterized per entity
    (ListResponse_Event_, ListResponse_Agent_, ...). The CLI exposes the same three
    controls on every list subcommand as --page, --limit and --search.
field_selection:
  supported: true
  param: fields
  applies_to_operations: 28
  cli_flag: --fields
  note: Column/field projection on list operations; the CLI mirrors it for table output.
expansion:
  supported: false
  note: No expand/include parameter is declared in the spec.
request_tracing:
  request_id_header: null
  note: >-
    No request-id or correlation-id header is declared in the OpenAPI. At the domain
    level Syllable models tracing through session_id and conversation_id, which thread
    through sessions, transcripts, timelines, latency and events.
versioning:
