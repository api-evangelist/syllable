  api_current: v1
  api_prefix: /api/v1
  spec_version: 0.0.3
  platform_release_scheme: date-based (vYY.M.DD)
  note: >-
    The HTTP API is pinned at /api/v1 and the OpenAPI carries info.version 0.0.3. The
