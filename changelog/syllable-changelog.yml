note: >-
  Syllable publishes a dated product release-notes stream on its marketing site rather
  than a versioned API changelog in the docs. Entries are platform-wide (console, agents,
  telephony, insights) and mix fixes with additions; breaking-change callouts are not a
  separate section. The API itself is pinned at /api/v1 and the OpenAPI carries
  info.version 0.0.3, so release dates — not API versions — are the moving part.
  Separately, the Go CLI is semver'd and its v2.0.0 release documents explicit breaking
  changes (see cli/syllable-cli.yml).
